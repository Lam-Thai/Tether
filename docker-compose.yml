services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tether
      POSTGRES_PASSWORD: tether
      POSTGRES_DB: tether
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tether-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tether -d tether"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tether-db-data:
