name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: '20 14 * * 1' # weekly, Monday 14:20 UTC

permissions:
  contents: read

jobs:
  detect-languages:
    name: Detect languages with source code
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      languages: ${{ steps.detect.outputs.languages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect which languages currently have source files
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          parts=()
          if find apps/api -type f -name '*.py' 2>/dev/null | grep -q .; then
            parts+=("python")
          fi
          # Tracked JS/TS anywhere (apps/web, root tooling, configs). No pipe, so pipefail can't mask a match.
          if [ -n "$(git ls-files -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs')" ]; then
            parts+=("javascript-typescript")
          fi
          if [ "${#parts[@]}" -eq 0 ]; then
            languages='[]'
          else
            joined=$(printf '"%s",' "${parts[@]}")
            languages="[${joined%,}]"
          fi
          echo "Detected languages with source code: $languages"
          echo "languages=$languages" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: detect-languages
    # A matrix with zero entries fails the whole workflow run rather than
    # skipping cleanly, so this repo (still CLAUDE.md-only stubs under
    # apps/api and apps/web) must guard the job itself, not just the matrix.
    if: needs.detect-languages.outputs.languages != '[]'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJson(needs.detect-languages.outputs.languages) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
