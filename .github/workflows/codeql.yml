name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: '20 14 * * 1' # weekly, Monday 14:20 UTC

permissions:
  contents: read

jobs:
  detect-languages:
    name: Detect languages with source code
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      languages: ${{ steps.detect.outputs.languages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect which languages currently have source files
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          parts=()
          # Tracked files only, and no `| grep -q` pipes: under pipefail, grep exiting early
          # can SIGPIPE the producer and silently drop a language.
          if [ -n "$(git ls-files -- 'apps/api/*.py')" ]; then
            parts+=("python")
          fi
          # JS/TS anywhere: apps/web, root tooling, configs.
          if [ -n "$(git ls-files -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.mjs' '*.cjs')" ]; then
            parts+=("javascript-typescript")
          fi
          if [ "${#parts[@]}" -eq 0 ]; then
            languages='[]'
          else
            joined=$(printf '"%s",' "${parts[@]}")
            languages="[${joined%,}]"
          fi
          echo "Detected languages with source code: $languages"
          echo "languages=$languages" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: detect-languages
    # A matrix with zero entries fails the whole workflow run rather than
    # skipping cleanly, so guard the job itself for when no language has
    # sources yet (e.g. apps/api before the walking skeleton lands).
    if: needs.detect-languages.outputs.languages != '[]'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJson(needs.detect-languages.outputs.languages) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
