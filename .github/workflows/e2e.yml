name: E2E

# Required check (slice 17): the MVP critical journey in a real browser, against the real
# Next.js app and the real FastAPI app with fake Gemini / Stripe / Google Calendar, a local
# Postgres and a REAL Clerk dev instance. 100% pass required; there are no retries.

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  # One run at a time: every run signs in as the same Clerk user and resets its data.
  group: e2e
  cancel-in-progress: false

jobs:
  e2e:
    name: Playwright critical journey
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tether
          POSTGRES_PASSWORD: tether
          POSTGRES_DB: tether
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tether -d tether"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      E2E_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      E2E_CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      E2E_CLERK_ISSUER: ${{ secrets.E2E_CLERK_ISSUER }}
      E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
      E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
      E2E_DATABASE_URL: postgresql://tether:tether@127.0.0.1:5432/tether
    steps:
      - name: Require the E2E secrets
        # A required check must never pass by skipping: a fork or a missing secret fails loudly.
        run: |
          missing=""
          for name in E2E_CLERK_PUBLISHABLE_KEY E2E_CLERK_SECRET_KEY E2E_CLERK_ISSUER E2E_CLERK_USER_EMAIL E2E_CLERK_USER_PASSWORD; do
            eval "value=\${$name:-}"
            if [ -z "$value" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=E2E secrets missing::These repository secrets are not available to this run:$missing. Forked pull requests do not receive secrets: push the branch to the main repository, or ask a maintainer to run E2E. This check is required, so it fails instead of skipping."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install
        working-directory: apps/api

      - name: Install API dependencies
        run: uv sync --locked
        working-directory: apps/api

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run the E2E journey
        run: pnpm --filter web e2e

      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
