name: Web

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: https://example.com
      # Dummy, syntactically-valid Clerk test keys (not real credentials) —
      # `@clerk/nextjs` requires both to be present for `next build` to
      # succeed, even though this CI job never talks to Clerk.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_ZXhhbXBsZS1zZWNyZXQta2V5LWZvci1jaS1vbmx5LTAwMDAwMDAwMDA
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter web lint

      - name: Type-check (web)
        run: pnpm --filter web typecheck

      - name: Test (Vitest, all projects)
        run: pnpm test

      - name: Build
        run: pnpm --filter web build
