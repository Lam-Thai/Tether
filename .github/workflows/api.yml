name: API

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: Lint, type-check, test, migrate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tether
          POSTGRES_PASSWORD: tether
          POSTGRES_DB: tether
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tether -d tether"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tether:tether@localhost:5432/tether
      CORS_ORIGINS: https://example.com
      ENVIRONMENT: ci
      APP_VERSION: ci
      CLERK_ISSUER: https://example.clerk.accounts.dev
      # Placeholders: tests swap Stripe for FakeBillingGateway; nothing calls Stripe in CI.
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
      STRIPE_PRICE_ID: price_ci_placeholder
      APP_BASE_URL: https://example.com
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type-check (pyright)
        run: uv run pyright

      - name: Run migrations against an empty database
        run: uv run alembic upgrade head

      - name: Test (pytest)
        run: uv run pytest
