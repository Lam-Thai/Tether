[project]
name = "tether-api"
version = "0.1.0"
description = "Tether FastAPI backend"
authors = [
    { name = "Lam Thai", email = "tuoclamthai@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pydantic-settings>=2.6",
    "alembic>=1.14",
    "pyjwt[crypto]>=2.9",
    "tzdata>=2026.5",
    "stripe>=16.0.0",
    "httpx>=0.27",
    "google-genai>=2.31.0",
    "pyyaml>=6.0",
    "cryptography>=50.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "pyright>=1.1",
    "types-pyyaml>=6.0",
    "pytest-xdist>=3.6",
]

[project.scripts]
tether-eval = "evals.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# Installed (editable) only so `uv run tether-eval` exists. `module-root = ""` puts this
# directory on the path, the same layout the app and tests already import from.
package = true

[tool.uv.build-backend]
module-name = "evals"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.pyright]
include = ["."]
exclude = ["migrations", ".venv"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: calls a real provider in test mode; opt-in via env flag, never in CI"]
