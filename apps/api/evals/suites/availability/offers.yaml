# Cases where the calendar has free time: the reply must state at least one time, and
# every time it states must be a start that is really free (`expected_times`, derived
# from the busy week in evals/calendar_script.py for the named service).
scorers: [offers_real_times, no_false_confirmation]
cases:
  # Haircut is 45 minutes. Thursday 06-04 is free 11:00-12:00 and 17:30-18:30.
  - id: avail-tomorrow
    turns: ["Do you have anything open tomorrow for a haircut?"]
    expected_tools: [check_availability]
    expected_times: ["11:00", "11:15", "17:30", "17:45"]
    tags: [relative-date, smoke]
  # Friday 06-05 is free 14:00-15:30; 3:00 PM does not fit a 45-minute haircut.
  - id: avail-friday-afternoon
    turns: ["I'd like a haircut this Friday afternoon, what times do you have?"]
    expected_tools: [check_availability]
    expected_times: ["14:00", "14:15", "14:30", "14:45"]
    tags: [relative-date, part-of-day, smoke]
  # Tuesday 06-09 is free 09:00-10:30.
  - id: avail-next-tuesday-morning
    turns: ["Any morning slots next Tuesday for a haircut?"]
    expected_tools: [check_availability]
    expected_times: ["09:00", "09:15", "09:30", "09:45"]
    tags: [relative-date, part-of-day]
  - id: avail-around-3pm
    turns: ["Can I get a haircut on Friday around 3pm?"]
    expected_tools: [check_availability]
    expected_times: ["14:00", "14:15", "14:30", "14:45"]
    tags: [relative-date, wanted-time]
  # Saturday 06-06 is free 13:00-14:00.
  - id: avail-saturday-gap
    turns: ["what does saturday look like for a haircut"]
    expected_tools: [check_availability]
    expected_times: ["13:00", "13:15"]
    tags: [relative-date]
  # Slang. A beard trim is 15 minutes: Thursday 11:00-12:00 and 17:30-18:30 on the grid.
  - id: avail-slang-beard-trim
    turns: ["yo u got any slots tmrw for a beard trim"]
    expected_tools: [check_availability]
    expected_times:
      ["11:00", "11:15", "11:30", "11:45", "17:30", "17:45", "18:00", "18:15"]
    tags: [slang]
  # Speech-to-text noise: "hair cut", fillers, a vague part of the day.
  - id: avail-stt-noise
    turns: ["uh hi yeah can i get a hair cut thursday maybe like evening time"]
    expected_tools: [check_availability]
    expected_times: ["11:00", "11:15", "17:30", "17:45"]
    tags: [stt]
  # An open calendar (nothing busy): any real start from opening on is fine.
  - id: avail-open-calendar-wednesday
    turns: ["Can I get a haircut on Wednesday of next week, whatever morning works?"]
    calendar: open
    expected_tools: [check_availability]
    expected_times:
      ["09:00", "09:15", "09:30", "09:45", "10:00", "10:15", "10:30", "10:45", "11:00", "11:15",
       "11:30", "11:45", "12:00", "12:15", "12:30", "12:45", "13:00", "13:15", "13:30", "13:45",
       "14:00", "14:15", "14:30", "14:45", "15:00", "15:15", "15:30", "15:45", "16:00", "16:15",
       "16:30", "16:45", "17:00", "17:15"]
    tags: [open-calendar]
